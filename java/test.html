<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />

    <title>OpenHTMLtoPDF Test</title>

    <style>
        @page {
            size: A4;
            margin: 40pt;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial;
            font-size: 16pt;
            font-weight: 400;
        }

        h1 {
            font-family: Arial;
            font-weight: 400;
            font-size: 24pt;
        }

        h2 {
            font-family: Arial;
            font-weight: 400;
            font-size: 20pt;
        }

        p {
            font-family: Arial;
            font-weight: 400;
            font-size: 16pt;
        }
    </style>
</head>

<body>

    <h1>Hello OpenHTMLtoPDF</h1>

    <p>
        This is a simple paragraph.
    </p>

    <h2>Second Heading</h2>

    <p>
        This is another paragraph.
    </p>

</body>
</html>
